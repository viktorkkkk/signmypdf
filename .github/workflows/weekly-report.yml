name: Weekly SEO Report

on:
  schedule:
    # 02:00 UTC Monday = 09:00 Monday in Bangkok (UTC+7).
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the report instead of sending it to Telegram'
        required: false
        default: 'false'

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and send the weekly report
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/weekly-report.mjs --dry-run
          else
            node scripts/weekly-report.mjs
          fi
