name: Weekly SEO Report

on:
  schedule:
    # 02:00 UTC Monday = 09:00 Monday in Bangkok (UTC+7).
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the report instead of sending it to Telegram'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and send the weekly report
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/weekly-report.mjs --dry-run
          else
            node scripts/weekly-report.mjs
          fi

      - name: Persist the index-status cache
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          # CI checks out fresh every run, so the cache only survives if it is
          # committed back. Without this the index count is recomputed (207
          # inspections) on every run and "previousIndexed" is always null,
          # which kills the shrinking-index alert.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/index-status.json || true
          git diff --cached --quiet && echo "cache unchanged" && exit 0
          git commit -m "chore(seo): index-status cache $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && break || sleep 5
          done
